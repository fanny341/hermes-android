name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Auto-version
        run: |
          # Use GitHub run number as build version
          # Format: 1.0.<run_number>+<run_number>
          VERSION="1.0.${{ github.run_number }}+${{ github.run_number }}"
          sed -i "s/^version:.*/version: $VERSION/" pubspec.yaml
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate debug keystore
        run: |
          # Generate keystore in android/ (Gradle resolves file() relative to project dir)
          keytool -genkey -v -keystore android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, OU=Android, O=Google, L=Mountain View, ST=CA, C=US"
          # key.properties must be at project root (parent of android/)
          echo "storeFile=debug.keystore" > key.properties
          echo "storePassword=android" >> key.properties
          echo "keyAlias=androiddebugkey" >> key.properties
          echo "keyPassword=android" >> key.properties
          cat key.properties

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --split-debug-info=build/debug-info

      - name: Get version for artifact name
        id: version
        run: |
          VER=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          echo "apk_version=$VER" >> $GITHUB_OUTPUT

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: moritzu-hermes-v${{ steps.version.outputs.apk_version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
